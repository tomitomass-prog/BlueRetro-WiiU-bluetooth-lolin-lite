name: Build WiiU USB bridge

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uart-tests:
    name: UART protocol tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test UART protocol
        run: python tools/test_packets.py

  build-usb-s2:
    name: Build LOLIN S2 Mini (PlatformIO)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install 'platformio==6.1.19'
      - name: Compile S2 firmware
        run: python -m platformio run -d usb-s2 -e lolin_s2_mini
      - name: Upload S2 firmware
        uses: actions/upload-artifact@v5
        with:
          name: lolin-s2-mini-firmware
          path: |
            usb-s2/.pio/build/lolin_s2_mini/firmware.bin
            usb-s2/.pio/build/lolin_s2_mini/bootloader.bin
            usb-s2/.pio/build/lolin_s2_mini/partitions.bin
          if-no-files-found: error

  build-bluetooth-lolin32:
    name: Build LOLIN32 Lite (Bluepad32)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PlatformIO and compatible Click
        run: |
          python -m pip install 'platformio==6.1.19'
          python -m pip install 'click==8.1.8'
      - name: Check PlatformIO version
        run: python -m platformio --version
      - name: Download Bluepad32 template
        run: |
          git clone --depth 1 --recurse-submodules \
            --shallow-submodules \
            https://github.com/ricardoquesada/esp-idf-arduino-bluepad32-template.git \
            /tmp/bluepad32-template
      - name: Insert adapter firmware
        run: |
          cp bluetooth-esp32/bluepad32_sender.cpp \
            /tmp/bluepad32-template/main/sketch.cpp
          cp shared/pad_packet.h \
            /tmp/bluepad32-template/main/pad_packet.h
          printf '\n[env:lolin32_lite]\nboard = lolin32_lite\n' \
            >> /tmp/bluepad32-template/platformio.ini
      - name: Compile LOLIN32 Lite
        run: |
          python -m platformio run \
            -d /tmp/bluepad32-template \
            -e lolin32_lite
      - name: Upload LOLIN32 firmware
        uses: actions/upload-artifact@v5
        with:
          name: lolin32-lite-bluepad32-firmware
          path: |
            /tmp/bluepad32-template/.pio/build/lolin32_lite/*.bin
          if-no-files-found: error
